<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Book your stay at Hotel Blue quickly and easily. Find comfortable rooms and great accommodations for your perfect trip.">
    <title>Hotel Blue - Booking</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/modern-css-reset/dist/reset.min.css" />
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <img src="logo-hotell.webp" alt="hotell logo" class="logo">
        <nav>
            <ul class="linktext">
                <li><a href="index.html">Welcome</a></li>
                <li><a href="book.html" class="active">Booking</a></li>
                <li><a href="find.html">Find us</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <article class="left">
                <h2>Booking</h2>
                <hr>
                <form action="javascript:void(0)" method="post" class="booking-form">
                    <label for="firstName">First name: </label>
                    <input type="text" id="firstName" name="firstName" placeholder="John" required>

                    <label for="lastName">Surname: </label>
                    <input type="text" id="lastName" name="lastName" placeholder="Doe" required>

                    <label for="totalGuests">Number of guests: </label>
                    <input type="number" id="totalGuests" name="totalGuests" min="1" max="10" required>

                    <label for="roomType">Room type: </label>
                    <select name="roomType" id="roomType" required>
                        <option value="">Choose room</option>
                        <option value="single">Single</option>
                        <option value="double">Double</option>
                        <option value="triple">Triple</option>
                    </select>

                    <label for="other">Additional requests: </label>
                    <textarea id="other" name="other" placeholder="..."></textarea>
                </form>
            </article>
            <article class="right">
                <form action="javascript:void(0)" method="post" class="booking-form">
                    <label for="ccNumber">CC number: </label>
                    <input type="text" id="ccNumber" name="ccNumber" placeholder="XXXX XXXX XXXX XXXX" required>

                    <label for="expiry">Expiry date: </label>
                    <input type="text" id="expiry" name="expiry" placeholder="MM-YY" required>

                    <label for="CVC">CVC: </label>
                    <input type="text" id="cvc" name="cvc" placeholder="XXX" required>
                    <p>Total: 100sek</p>
                    <button id="bookBtn" type="button">Book</button>
                </form>
            </article>
        </section>
    </main>
    <footer>Hotel Blue | Storgatan 1 | 123 45 Storstad | 012 - 34 56</footer>

</body>


</html>
